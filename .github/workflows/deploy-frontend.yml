name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
      - 006-deployment-cicd
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:  # Allow manual trigger

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        working-directory: frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        working-directory: frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Production)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/006-deployment-cicd')
        working-directory: frontend
        id: deploy-prod
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "✅ Production deployment: $DEPLOYMENT_URL"

      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        working-directory: frontend
        id: deploy-preview
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "✅ Preview deployment: $DEPLOYMENT_URL"

      - name: Comment PR with Preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview Deployment Ready!\n\n**Preview URL**: ${{ steps.deploy-preview.outputs.deployment_url }}\n\n✅ Frontend deployed successfully to Vercel preview environment.`
            })

      - name: Verify Deployment
        if: github.event_name == 'push'
        run: |
          echo "🔍 Verifying deployment..."
          sleep 10  # Wait for deployment to be ready

          DEPLOYMENT_URL="${{ steps.deploy-prod.outputs.deployment_url }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $DEPLOYMENT_URL)

          if [ $HTTP_CODE -eq 200 ]; then
            echo "✅ Frontend is accessible (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Frontend returned HTTP $HTTP_CODE"
          fi

      - name: Deployment Summary
        if: always()
        run: |
          echo "## 📊 Frontend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" == "push" ]; then
            echo "- **Type**: Production Deployment" >> $GITHUB_STEP_SUMMARY
            echo "- **URL**: ${{ steps.deploy-prod.outputs.deployment_url }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Type**: Preview Deployment" >> $GITHUB_STEP_SUMMARY
            echo "- **URL**: ${{ steps.deploy-preview.outputs.deployment_url }}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Quick Links" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" == "push" ]; then
            echo "- [View Production Site](${{ steps.deploy-prod.outputs.deployment_url }})" >> $GITHUB_STEP_SUMMARY
            echo "- [Vercel Dashboard](https://vercel.com/dashboard)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- [View Preview Site](${{ steps.deploy-preview.outputs.deployment_url }})" >> $GITHUB_STEP_SUMMARY
          fi
